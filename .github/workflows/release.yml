# Builds KubesTUI for Windows, macOS and Linux and publishes a GitHub
# Release whenever a version tag is pushed:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# scripts/install.ps1 and scripts/install.sh download from the latest
# release and verify the files against SHA256SUMS.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: |
          for os in linux windows darwin; do GOOS=$os go vet ./...; done

      - name: Build
        run: |
          mkdir -p dist
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            [ "$os" = windows ] && ext=.exe
            echo "Building kubestui-$os-$arch$ext"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/kubestui-$os-$arch$ext" .
          done
          cd dist && sha256sum kubestui-* > SHA256SUMS && cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
